plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.wedo80.app'
    compileSdk 34

    def envProperties = findProperty("env") ?: "dev"

    // Directly specify the path to the properties file
    def propertiesFile = "gradle-${envProperties}.properties"

    // Load properties using direct path
    def props = new Properties()
    props.load(new FileInputStream(propertiesFile))
    def baseUrlWithApi = "${props['BASE_URL_STRING']}${props['API_VERSION_STRING']}"
    defaultConfig {
        applicationId "com.wedo8020.app"
        minSdk 24
        targetSdk 34
        versionCode $versionCode
        versionName "$versionName"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "BASE_URL", "\"${baseUrlWithApi}\"")
        buildConfigField("String", "SOCKET_URL", "\"${props['SOCKET_URL_STRING']}\"")
        buildConfigField("String", "ENCRYPT_SECRET", "\"${props['CRYPTO_SECRET_STRING']}\"")

    }

    buildTypes {
        debug {
            minifyEnabled false
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures
            {
                buildConfig = true
                dataBinding = true
                viewBinding true
            }
    lintOptions {
        checkReleaseBuilds false
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
}

